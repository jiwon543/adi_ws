# vlm_mock.yaml
# ─────────────────────────────────────────────────────────────────
# bag 재생 시작 기준 경과 시간 [초] 으로 미션 힌트를 주입합니다.
#
# candidate 종류:
#   normal_drive   → LANE_FOLLOW
#   cone_avoidance → CONE_AVOID  (LiDAR 검증 통과 시 전환)
#   crosswalk_stop → CROSSWALK
#   obstacle_stop  → EMERGENCY_STOP (LiDAR 검증 통과 시 전환)
#
# 사용법:
#   1) rosbag play --clock songdo_01.bag 으로 bag 내용을 먼저 확인
#   2) 콘/장애물/횡단보도가 등장하는 시간대를 파악
#   3) 아래 t_start/t_end 를 수정
# ─────────────────────────────────────────────────────────────────

schedule:
  - { t_start:  0.0, t_end: 20.0, candidate: "normal_drive",   vlm_raw: "clear road ahead" }
  - { t_start: 20.0, t_end: 32.0, candidate: "cone_avoidance", vlm_raw: "orange traffic cones blocking the path" }
  - { t_start: 32.0, t_end: 47.0, candidate: "normal_drive",   vlm_raw: "road is clear" }
  - { t_start: 47.0, t_end: 58.0, candidate: "crosswalk_stop", vlm_raw: "pedestrian crossing with yellow markings" }
  - { t_start: 58.0, t_end: 72.0, candidate: "normal_drive",   vlm_raw: "normal road ahead" }
  - { t_start: 72.0, t_end: 84.0, candidate: "obstacle_stop",  vlm_raw: "vehicle blocking the road" }
  - { t_start: 84.0, t_end: 999.0, candidate: "normal_drive",  vlm_raw: "road is clear" }

publish_rate: 2.0   # Hz (decision 의 vlm_hint_timeout=3.0s 보다 빠르게 유지)
