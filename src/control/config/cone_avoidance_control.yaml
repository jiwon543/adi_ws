# config/cone_avoidance_control.yaml

# ── 콘 감지 범위 ──
avoid_dist:    0.7     # 전방 감지 한계 [m] — 이 거리 이내 콘만 처리
lateral_limit: 1.0     # 좌우 감지 폭 [m] — 이 폭 바깥 콘은 무시
stop_dist:     0.05    # [m] — 이 거리 미만 콘 → 강제 회피 FSM 진입

# ── 회피 FSM (후진 → 정지 → 복귀) ──
avoid_hold_sec: 0.5    # REVERSE(후진) 유지 시간 [s]
avoid_stop_sec: 1.0    # STOP(정지+조향) 유지 시간 [s]
reverse_speed: -0.1    # 후진 속도 [m/s] (음수)

# ── 원거리 콘 gap 조향 ──
avoid_gain:    3.0      # gap 중심 반발 게인
avoid_speed:   0.2      # 콘 감지 시 전진 속도 [m/s]
max_steering:  0.45     # 최대 조향각 [rad] (하드웨어 한계 0.5236)
steering_bias: 0.0      # 조향 오프셋 보정 [rad] — 왼쪽 치우침이면 음수(예: -0.1)

# ── 콘 클리어 판정 ──
cone_clear_sec: 1.0    # 이 시간 동안 콘 없으면 CONE_AVOID_DONE 퍼블리시 [s]

# ── 제어 주기 ──
control_rate: 30.0     # [Hz]

# ── 디버그 ──
debug_mode: true      # true: decision node 없이 단독 실행
