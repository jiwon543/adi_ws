# config/lidar_clustering_debug.yaml
# 디버깅용 — 감지 범위 넓히고, 클러스터링 조건 완화

eps: 0.1          # 0.1 → 클러스터 묶이는 반경 넓힘 (포인트 수 적어도 묶임)
min_samples: 4     # 7  → 최소 포인트 수 낮춤 (노이즈 많이 잡히지만 놓치지 않음)

# Front-angle ROI (degrees)
roi_angle_min: -40.0   # 전방 80° FOV — 측면 넘어간 콘 즉시 소멸 → cone exit 빠름
roi_angle_max:  40.0

# Distance ROI (meters)
roi_range_max: 1.5      # [m]